name: Check Subaru API Version

# Nightly job that downloads the latest MySubaru Android app, extracts the Connected
# Services API version embedded in its JavaScript bundle, and compares it against the
# API_VERSION constant in the repo. When Subaru bumps the API version it breaks this
# package, so a failure here notifies maintainers that an update is needed.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-api-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The raw d.apkpure.com browser endpoint returns HTTP 403 for datacenter IPs
      # (such as GitHub-hosted runners). apkeep talks to APKPure's app-facing API, which
      # is far more reliable from CI, and also resolves "latest" for us.
      - name: Install apkeep
        env:
          APKEEP_VERSION: "1.0.0"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            -o apkeep \
            "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          chmod +x apkeep
          ./apkeep --version

      - name: Download latest MySubaru APK
        run: |
          set -euo pipefail
          mkdir -p apk_download
          ./apkeep -a com.subaru.telematics.app.remote -d apk-pure apk_download
          ls -la apk_download

      - name: Unpack APK and locate JS bundle
        run: |
          set -euo pipefail
          mkdir -p apk_extracted
          # apkeep writes an .apk or .xapk (both are zip archives) named after the package.
          shopt -s nullglob
          archives=(apk_download/*.apk apk_download/*.xapk)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::apkeep did not produce an APK/XAPK in apk_download"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            unzip -o -q "$archive" -d apk_extracted
          done
          # XAPK bundles wrap one or more split APKs; unpack any nested APKs too.
          find apk_extracted -name '*.apk' -exec unzip -o -q {} -d apk_extracted \; || true
          BUNDLE="$(find apk_extracted -name 'index.android.bundle' | head -n1)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::Could not find index.android.bundle inside the downloaded APK"
            exit 1
          fi
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          ls -la "$BUNDLE"

      - name: Compare API version against repo
        run: |
          python scripts/check_api_version.py --bundle "$BUNDLE"
